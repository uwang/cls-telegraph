[project]
name = "cls-telegraph"
version = "0.1.0"
description = "财联社电报 CLI 工具，在终端获取、筛选和实时监控财联社电报快讯"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28.0",
]

[project.scripts]
cls-telegraph = "cls_telegraph:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["cls_telegraph.py"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
